
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Test and SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. Configure .NET
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 3. Restore dependencies
      - name: Restore
        run: dotnet restore EventRelay.slnx

      # 4. Install SonarQube and coverage tools
      - name: Install analysis tools
        run: |
          dotnet tool install --global dotnet-sonarscanner
          dotnet tool install --global dotnet-coverage

      # 5. Begin SonarQube analysis
      - name: SonarQube Begin
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        run: |
          dotnet sonarscanner begin \
            /k:"$SONAR_PROJECT_KEY" \
            /o:"$SONAR_ORGANIZATION" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" \
            /d:sonar.qualitygate.wait=true

      # 6. Build solution
      - name: Build
        run: |
          dotnet build EventRelay.slnx \
            --no-restore \
            --no-incremental \
            --configuration Release

      # 7. Install Playwright Chromium
      - name: Install Playwright Chromium
        run: |
          pwsh services/ControlPlaneService/tests/EventRelay.ControlPlaneService.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps --only-shell chromium

      # 8. Unit, integration and Testcontainers E2E
      - name: Run tests with coverage
        run: |
          dotnet-coverage collect \
            'dotnet test EventRelay.slnx --no-build --configuration Release --filter "Category!=ComposeE2E" --logger "console;verbosity=normal"' \
            -f xml \
            -o coverage.xml

      # 9. Complete SonarQube analysis
      - name: SonarQube End
        id: sonar_end
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner end \
            /d:sonar.token="$SONAR_TOKEN"

      # 10. Generate detailed SonarQube PR report
      - name: Generate SonarQube PR report
        id: sonar_report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && (steps.sonar_end.outcome == 'success' || steps.sonar_end.outcome == 'failure') }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 .github/scripts/sonar-pr-report.py

      # 11. Publish or update GitHub PR comment
      - name: Publish SonarQube PR report
        if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && steps.sonar_report.outcome == 'success' }}
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: eventrelay-sonar-report
          path: sonar-pr-report.md

      # 12. Generate temporary local credentials
      - name: Configure Docker environment
        shell: bash
        run: |
          {
            echo "ASPNETCORE_ENVIRONMENT=Development"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)"
            echo "KEYCLOAK_ADMIN_USERNAME=admin"
            echo "KEYCLOAK_ADMIN_PASSWORD=$(openssl rand -hex 24)"
            echo "KEYCLOAK_DEV_USER_PASSWORD=$(openssl rand -hex 24)"
            echo "KEYCLOAK_SECOND_USER_PASSWORD=$(openssl rand -hex 24)"
          } > .env

          chmod 600 .env

      # 13. Start the full application
      - name: Start Docker Compose
        run: docker compose up --build -d

      # 14. Run real cross-service E2E tests
      - name: Run Docker Compose E2E tests
        run: |
          dotnet test tests/EventRelay.E2E.Tests/EventRelay.E2E.Tests.csproj \
            --no-build \
            --configuration Release \
            --filter "Category=ComposeE2E" \
            --logger "console;verbosity=normal"

      # 15. Diagnostics on failure
      - name: Show Docker logs on failure
        if: failure()
        run: |
          if [ -f .env ]; then
            docker compose ps -a
            docker compose logs --no-color --tail=100
          fi

      # 16. Always clean up
      - name: Cleanup
        if: always()
        run: |
          if [ -f .env ]; then
            docker compose down --volumes --remove-orphans
            rm -f .env
          fi


services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME:?Set KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./infra/local/keycloak:/opt/keycloak/data/import:ro
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventrelay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U eventrelay -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  control-plane-migrations:
    build:
      context: .
      dockerfile: ./ControlPlane.Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ProjectDatabase: "Host=postgres;Port=5432;Database=eventrelay_projects;Username=eventrelay;Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  control-plane-service:
    build:
      context: .
      dockerfile: services/ControlPlaneService/src/EventRelay.ControlPlaneService.Api/Dockerfile
    ports:
      - "127.0.0.1:5101:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__ProjectDatabase: "Host=postgres;Port=5432;Database=eventrelay_projects;Username=eventrelay;Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}"
      Authentication__Issuer: "http://localhost:8081/realms/eventrelay"
      Authentication__MetadataAddress: "http://keycloak:8080/realms/eventrelay/.well-known/openid-configuration"
      Authentication__Audience: "eventrelay-api"
    depends_on:
      control-plane-migrations:
        condition: service_completed_successfully
      keycloak:
        condition: service_started

  event-service:
    build:
      context: .
      dockerfile: services/EventService/src/EventRelay.EventService/Dockerfile
    ports:
      - "127.0.0.1:5102:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__EventDatabase: "Host=postgres;Port=5432;Database=eventrelay_events;Username=eventrelay;Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy

  delivery-service:
    build:
      context: .
      dockerfile: services/DeliveryService/src/EventRelay.DeliveryService/Dockerfile
    environment:
      ConnectionStrings__DeliveryDatabase: "Host=postgres;Port=5432;Database=eventrelay_deliveries;Username=eventrelay;Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: gateway/EventRelay.Gateway/Dockerfile
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ReverseProxy__Clusters__controlPlane__Destinations__primary__Address: "http://control-plane-service:8080/"
      ReverseProxy__Clusters__events__Destinations__primary__Address: "http://event-service:8080/"
    depends_on:
      - control-plane-service
      - event-service

volumes:
  postgres_data:
  keycloak_data:

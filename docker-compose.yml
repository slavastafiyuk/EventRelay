
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: eventrelay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventrelay -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  project-service:
    build:
      context: .
      dockerfile: services/ProjectService/src/EventRelay.ProjectService.Api/Dockerfile
    ports:
      - "127.0.0.1:5101:8080"
    environment:
      ConnectionStrings__ProjectDatabase: "Host=postgres;Port=5432;Database=eventrelay_projects;Username=eventrelay;Password=${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}"
    depends_on:
      postgres:
        condition: service_healthy

  event-service:
    build:
      context: .
      dockerfile: services/EventService/src/EventRelay.EventService/Dockerfile
    ports:
      - "127.0.0.1:5102:8080"

  delivery-service:
    build:
      context: .
      dockerfile: services/DeliveryService/src/EventRelay.DeliveryService/Dockerfile

  gateway:
    build:
      context: .
      dockerfile: gateway/EventRelay.Gateway/Dockerfile
    ports:
      - "127.0.0.1:5000:8080"
    environment:
      ReverseProxy__Clusters__projects__Destinations__primary__Address: "http://project-service:8080/"
      ReverseProxy__Clusters__events__Destinations__primary__Address: "http://event-service:8080/"
    depends_on:
      - project-service
      - event-service

volumes:
  postgres_data:
